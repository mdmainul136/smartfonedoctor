services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://smartfone:ndui8vLNFPy0MylzixT8@smartfone-doctor-smartfone-doctor-ovfvrh:5432/smartfone}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://smartfone:ndui8vLNFPy0MylzixT8@smartfone-doctor-smartfone-doctor-ovfvrh:5432/smartfone}
      - DATABASE_URI=${DATABASE_URI:-postgresql://smartfone:ndui8vLNFPy0MylzixT8@smartfone-doctor-smartfone-doctor-ovfvrh:5432/smartfone}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-smartfonedoctor-philadelphia-payload-secret-key-32chars}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://smartfonedoctor.com}
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true
