version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/smartfonedoctor}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://postgres:postgres@db:5432/smartfonedoctor}
      - DATABASE_URI=${DATABASE_URI:-postgresql://postgres:postgres@db:5432/smartfonedoctor}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:-smartfonedoctor-philadelphia-payload-secret-key-32chars}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://smartfonedoctor.com}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smartfonedoctor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartfonedoctor}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
